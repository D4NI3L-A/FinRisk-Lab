[theme]
base = "light"
primaryColor = "#2A5BD7"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F6FB"
textColor = "#0E1B33"
borderColor = "#E3E8F0"
showWidgetBorder = true
baseRadius = "0.75rem"
buttonRadius = "full"
font = "Manrope:https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap, sans-serif"
headingFontWeights = [800, 800, 700, 700, 600, 600]
chartCategoricalColors = ["#2A5BD7", "#0F9D6B", "#D98E04", "#E04848", "#7C8AA5", "#8B5CF6"]

[theme.sidebar]
backgroundColor = "#F7F9FC"
secondaryBackgroundColor = "#FFFFFF"

[browser]
gatherUsageStats = false

[server]
runOnSave = true
